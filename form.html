<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Rory O'Connell-Maritz">
  <meta name="description"
    content="Week 05 Product Review Form with required fields, ratings, and confirmation counter.">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="productName">Product Name</label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product...</option>
        <!-- Options populated by JS -->
      </select>

      <!-- Overall Rating -->
      <fieldset class="rating">
        <legend>Overall Rating <span class="required">(Required)</span></legend>
        <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> ★</label>
        <label for="rating2"><input type="radio" id="rating2" name="rating" value="2" required> ★★</label>
        <label for="rating3"><input type="radio" id="rating3" name="rating" value="3" required> ★★★</label>
        <label for="rating4"><input type="radio" id="rating4" name="rating" value="4" required> ★★★★</label>
        <label for="rating5"><input type="radio" id="rating5" name="rating" value="5" required> ★★★★★</label>
      </fieldset>

      <!-- Date of Installation -->
      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Features -->
      <fieldset class="features">
        <legend>Which features did you find most useful?<br><em>(Check all that apply)</em></legend>
        <label for="feature1"><input type="checkbox" id="feature1" name="features" value="Durability">
          Durability</label>
        <label for="feature2"><input type="checkbox" id="feature2" name="features" value="Ease of Use"> Ease of
          Use</label>
        <label for="feature3"><input type="checkbox" id="feature3" name="features" value="Performance">
          Performance</label>
        <label for="feature4"><input type="checkbox" id="feature4" name="features" value="Design"> Design</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review <span class="optional">(Optional)</span></label>
      <textarea id="review" name="review"></textarea>

      <!-- User Name -->
      <label for="username">Your Name <span class="optional">(Optional)</span></label>
      <input type="text" id="username" name="username">

      <!-- Submit -->
      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>© <span id="currentyear"></span> ⫴ Rory Maritz ⫴ South Africa</p>
    <p id="lastmodified">Last Modified: <span id="lastmodifieddate"></span></p>
  </footer>
</body>

</html>
