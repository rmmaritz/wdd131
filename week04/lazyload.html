<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Merriweather&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/lazyload.css">
  <script src="scripts/lazyload.js" defer></script>
  <meta name="author" content="Rory O'Connell-Maritz">
  <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Rory Maritz - Lazy Load Learning">
  <title>WDD 131 - Week 04 Lazy Load Functionality - Rory Maritz</title>
</head>

<body>
  <main>
    <h1>Lazy Loading Images</h1>

    <!-- Six stacked images -->
    <img src="images/atlanta-georgia-temple.jpg" alt="Atlanta Georgia Temple" width="400" height="600" loading="lazy">
    <img src="images/billings-montana-temple.jpg" alt="Billings Montana Temple" width="400" height="600" loading="lazy">
    <img src="images/brigham-city-utah-temple.jpg" alt="Brigham City Utah Temple" width="400" height="600"
      loading="lazy">
    <img src="images/cardston-alberta-temple.jpg" alt="Cardston Alberta Temple" width="400" height="600" loading="lazy">
    <img src="images/johannesburg-temple.jpg" alt="Johannesburg South Africa Temple" width="400" height="600"
      loading="lazy">
    <img src="images/new-mexico-temple.jpg" alt="New Mexico Temple" width="400" height="600" loading="lazy">
  </main>

  <footer>
    <p id="lastModified"></p>
  </footer>
</body>

</html>
